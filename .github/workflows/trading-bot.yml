name: Trading Bot

on:
  schedule:
    # US market hours (EDT, UTC-4): open 9:30 AM = 13:30 UTC, close 4:00 PM = 20:00 UTC
    - cron: '35 13 * * 1-5'   # ~9:35 AM EDT (just after open)
    - cron: '0 14-19 * * 1-5' # hourly 10:00 AM - 3:00 PM EDT
    - cron: '55 19 * * 1-5'   # ~3:55 PM EDT (just before close)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-bot
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/amazing-ride-d2d7vs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scan only (dry-run, no credentials)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python main.py --scan-once --dry-run
