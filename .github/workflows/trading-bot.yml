name: Trading Bot

on:
  schedule:
    # 美股交易时段每小时运行（UTC 13:00-20:00 = 北京 21:00-04:00，周一到周五）
    - cron: '0 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/amazing-ride-d2d7vs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Scan & Trade
        env:
          ROBINHOOD_EMAIL: ${{ secrets.ROBINHOOD_EMAIL }}
          ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
          ROBINHOOD_MFA_KEY: ${{ secrets.ROBINHOOD_MFA_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python main.py --live --scan-once --yes
