name: Monitor Positions

on:
  schedule:
    - cron: '0 14-21 * * 1-5'  # UTC 14:00-21:00 每小时 = 北京 22:00-05:00（美股交易时段）
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/amazing-ride-d2d7vs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Monitor positions
        env:
          ROBINHOOD_EMAIL: ${{ secrets.ROBINHOOD_EMAIL }}
          ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
          ROBINHOOD_MFA_KEY: ${{ secrets.ROBINHOOD_MFA_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -c "
from src.secrets import load_encrypted_credentials
load_encrypted_credentials()
from src.strategy import EventDrivenStrategy
s = EventDrivenStrategy(dry_run=False)
s.monitor_only()
"
